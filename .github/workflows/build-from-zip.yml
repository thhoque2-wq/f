name: Build Screen Recorder APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages & accept licenses
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -f "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project files
        shell: bash
        run: |
          set -e
          mkdir -p project/app/src/main/java/com/example/screenrecorder
          mkdir -p project/app/src/main/res/values

          # ---------- Root settings ----------
          cat > project/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ScreenRecorder"
          include(":app")
          EOF

          # ---------- Root build.gradle.kts ----------
          cat > project/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.0" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
          }
          EOF

          # ---------- gradle.properties ----------
          cat > project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          # ---------- app/build.gradle.kts ----------
          cat > project/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.screenrecorder"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.screenrecorder"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
          }
          EOF

          # ---------- AndroidManifest.xml ----------
          cat > project/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.ScreenRecorder">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".RecorderService"
                      android:foregroundServiceType="mediaProjection"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          # ---------- strings.xml ----------
          cat > project/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Screen Recorder</string>
          </resources>
          EOF

          # ---------- themes.xml ----------
          cat > project/app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.ScreenRecorder" parent="android:Theme.Material.Light.DarkActionBar" />
          </resources>
          EOF

          echo "Base project files created."
          find project -type f | sort
