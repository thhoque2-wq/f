name: Build Screen Recorder APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages & accept licenses
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -f "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true[reference:3]
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project files
        shell: bash
        run: |
          set -e
          mkdir -p project/app/src/main/java/com/example/screenrecorder
          mkdir -p project/app/src/main/res/values

          # settings.gradle.kts
          printf '%s\n' \
          'pluginManagement {' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '        gradlePluginPortal()' \
          '    }' \
          '}' \
          'dependencyResolutionManagement {' \
          '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '    }' \
          '}' \
          'rootProject.name = "ScreenRecorder"' \
          'include(":app")' > project/settings.gradle.kts

          # build.gradle.kts (root)
          printf '%s\n' \
          'plugins {' \
          '    id("com.android.application") version "8.7.0" apply false' \
          '    id("org.jetbrains.kotlin.android") version "2.0.20" apply false' \
          '}' > project/build.gradle.kts

          # gradle.properties
          printf '%s\n' \
          'org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8' \
          'android.useAndroidX=true' \
          'kotlin.code.style=official' \
          'android.nonTransitiveRClass=true' > project/gradle.properties

          # app/build.gradle.kts
          printf '%s\n' \
          'plugins {' \
          '    id("com.android.application")' \
          '    id("org.jetbrains.kotlin.android")' \
          '}' \
          'android {' \
          '    namespace = "com.example.screenrecorder"' \
          '    compileSdk = 35' \
          '    defaultConfig {' \
          '        applicationId = "com.example.screenrecorder"' \
          '        minSdk = 26' \
          '        targetSdk = 34' \
          '        versionCode = 1' \
          '        versionName = "1.0"' \
          '    }' \
          '    buildTypes { release { isMinifyEnabled = false } }' \
          '    compileOptions {' \
          '        sourceCompatibility = JavaVersion.VERSION_17' \
          '        targetCompatibility = JavaVersion.VERSION_17' \
          '    }' \
          '    kotlinOptions { jvmTarget = "17" }' \
          '}' \
          'dependencies {' \
          '    implementation("androidx.startup:startup-runtime:1.2.0")' \
          '}' > project/app/build.gradle.kts[reference:4]

          # AndroidManifest.xml
          printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
          '    <uses-permission android:name="android.permission.RECORD_AUDIO" />' \
          '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' \
          '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />' \
          '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' \
          '    <application android:allowBackup="true" android:label="@string/app_name" android:theme="@style/Theme.ScreenRecorder">' \
          '        <activity android:name=".MainActivity" android:exported="true">' \
          '            <intent-filter>' \
          '                <action android:name="android.intent.action.MAIN" />' \
          '                <category android:name="android.intent.category.LAUNCHER" />' \
          '            </intent-filter>' \
          '        </activity>' \
          '        <service android:name=".RecorderService" android:foregroundServiceType="mediaProjection" android:exported="false" />' \
          '    </application>' \
          '</manifest>' > project/app/src/main/AndroidManifest.xml[reference:5]

          # strings.xml & themes.xml
          printf '%s\n' '<resources><string name="app_name">Screen Recorder</string></resources>' > project/app/src/main/res/values/strings.xml
          printf '%s\n' '<resources><style name="Theme.ScreenRecorder" parent="android:Theme.Material.Light.DarkActionBar" /></resources>' > project/app/src/main/res/values/themes.xml

          echo "Base project files created."
          find project -type f | sort

      - name: Create Kotlin source files
        shell: bash
        run: |
          set -e
          # MainActivity.kt (একই লজিক, শুধু printf দিয়ে লেখা)
          printf '%s\n' \
          'package com.example.screenrecorder' \
          '' \
          'import android.Manifest' \
          'import android.app.Activity' \
          'import android.content.Context' \
          'import android.content.Intent' \
          'import android.media.projection.MediaProjectionManager' \
          'import android.os.Build' \
          'import android.os.Bundle' \
          'import android.widget.Button' \
          'import android.widget.LinearLayout' \
          'import android.widget.TextView' \
          'import android.widget.Toast' \
          '' \
          'class MainActivity : Activity() {' \
          '    private lateinit var statusText: TextView' \
          '    private val REQ_PROJECTION = 1001' \
          '    private val REQ_PERMS = 2001' \
          '' \
          '    override fun onCreate(savedInstanceState: Bundle?) {' \
          '        super.onCreate(savedInstanceState)' \
          '        val layout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(48, 48, 48, 48) }' \
          '        statusText = TextView(this).apply { text = "Screen Recorder\n\nStatus: Idle"; textSize = 18f }' \
          '        layout.addView(statusText)' \
          '        layout.addView(Button(this).apply { text = "Start Recording"; setOnClickListener { checkPermsAndStart() } })' \
          '        layout.addView(Button(this).apply { text = "Stop Recording"; setOnClickListener { stopRecording() } })' \
          '        setContentView(layout)' \
          '        requestBasePermissions()' \
          '    }' \
          '' \
          '    private fun requestBasePermissions() {' \
          '        val perms = mutableListOf(Manifest.permission.RECORD_AUDIO)' \
          '        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) perms.add(Manifest.permission.POST_NOTIFICATIONS)' \
          '        requestPermissions(perms.toTypedArray(), REQ_PERMS)' \
          '    }' \
          '' \
          '    private fun checkPermsAndStart() {' \
          '        val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager' \
          '        @Suppress("DEPRECATION") startActivityForResult(mpm.createScreenCaptureIntent(), REQ_PROJECTION)' \
          '    }' \
          '' \
          '    @Suppress("DEPRECATION") override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {' \
          '        super.onActivityResult(requestCode, resultCode, data)' \
          '        if (requestCode == REQ_PROJECTION && resultCode == RESULT_OK && data != null) {' \
          '            val svc = Intent(this, RecorderService::class.java).apply {' \
          '                action = RecorderService.ACTION_START' \
          '                putExtra(RecorderService.EXTRA_RESULT_CODE, resultCode)' \
          '                putExtra(RecorderService.EXTRA_RESULT_DATA, data)' \
          '            }' \
          '            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(svc) else startService(svc)' \
          '            statusText.text = "Screen Recorder\n\nStatus: Recording"' \
          '            Toast.makeText(this, "Recording started", Toast.LENGTH_SHORT).show()' \
          '        }' \
          '    }' \
          '' \
          '    private fun stopRecording() {' \
          '        startService(Intent(this, RecorderService::class.java).apply { action = RecorderService.ACTION_STOP })' \
          '        statusText.text = "Screen Recorder\n\nStatus: Stopped"' \
          '    }' \
          '}' > project/app/src/main/java/com/example/screenrecorder/MainActivity.kt

          # RecorderService.kt (সঠিক ক্রম: setOutputFile -> prepare -> start)
          printf '%s\n' \
          'package com.example.screenrecorder' \
          '' \
          'import android.Manifest' \
          'import android.app.*' \
          'import android.content.Context' \
          'import android.content.Intent' \
          'import android.content.pm.PackageManager' \
          'import android.content.pm.ServiceInfo' \
          'import android.hardware.display.DisplayManager' \
          'import android.hardware.display.VirtualDisplay' \
          'import android.media.MediaRecorder' \
          'import android.media.projection.MediaProjection' \
          'import android.media.projection.MediaProjectionManager' \
          'import android.os.Build' \
          'import android.os.Environment' \
          'import android.os.IBinder' \
          'import android.util.Log' \
          'import java.io.File' \
          'import java.text.SimpleDateFormat' \
          'import java.util.*' \
          '' \
          'class RecorderService : Service() {' \
          '    companion object {' \
          '        const val ACTION_START = "START"' \
          '        const val ACTION_STOP = "STOP"' \
          '        const val EXTRA_RESULT_CODE = "result_code"' \
          '        const val EXTRA_RESULT_DATA = "result_data"' \
          '        private const val CHANNEL_ID = "rec_channel"' \
          '        private const val NOTIF_ID = 1' \
          '        private const val TAG = "RecorderService"' \
          '    }' \
          '' \
          '    private var mediaProjection: MediaProjection? = null' \
          '    private var virtualDisplay: VirtualDisplay? = null' \
          '    private var mediaRecorder: MediaRecorder? = null' \
          '    private var outputFile: File? = null' \
          '' \
          '    override fun onBind(intent: Intent?): IBinder? = null' \
          '' \
          '    override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {' \
          '        when (intent?.action) {' \
          '            ACTION_START -> {' \
          '                createChannel()' \
          '                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {' \
          '                    startForeground(NOTIF_ID, buildNotification(), ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)' \
          '                } else {' \
          '                    startForeground(NOTIF_ID, buildNotification())' \
          '                }' \
          '                val resultCode = intent.getIntExtra(EXTRA_RESULT_CODE, 0)' \
          '                @Suppress("DEPRECATION") val data = intent.getParcelableExtra(EXTRA_RESULT_DATA) as? Intent' \
          '                if (data != null) startRecording(resultCode, data)' \
          '            }' \
          '            ACTION_STOP -> stopRecording()' \
          '        }' \
          '        return START_NOT_STICKY' \
          '    }' \
          '' \
          '    @Suppress("DEPRECATION") private fun startRecording(resultCode: Int, data: Intent) {' \
          '        try {' \
          '            val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager' \
          '            mediaProjection = mpm.getMediaProjection(resultCode, data)' \
          '            val dir = File(getExternalFilesDir(Environment.DIRECTORY_MOVIES) ?: filesDir, "ScreenRecorder")' \
          '            if (!dir.exists()) dir.mkdirs()' \
          '            val ts = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())' \
          '            outputFile = File(dir, "rec_$ts.mp4")' \
          '            val recorder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) MediaRecorder(this) else MediaRecorder()' \
          '            mediaRecorder = recorder' \
          '            val hasAudio = checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED' \
          '            if (hasAudio) {' \
          '                recorder.setAudioSource(MediaRecorder.AudioSource.MIC)' \
          '                recorder.setAudioEncoder(MediaRecorder.AudioEncoder.AAC)' \
          '                recorder.setAudioEncodingBitRate(128000)' \
          '                recorder.setAudioSamplingRate(44100)' \
          '            }' \
          '            recorder.setVideoSource(MediaRecorder.VideoSource.SURFACE)' \
          '            recorder.setOutputFormat(MediaRecorder.OutputFormat.MPEG_4)' \
          '            recorder.setOutputFile(outputFile!!.absolutePath)' \
          '            recorder.setVideoEncoder(MediaRecorder.VideoEncoder.H264)' \
          '            recorder.setVideoEncodingBitRate(6000000)' \
          '            recorder.setVideoFrameRate(30)' \
          '            val metrics = resources.displayMetrics' \
          '            val w = metrics.widthPixels / 2 * 2' \
          '            val h = metrics.heightPixels / 2 * 2' \
          '            recorder.setVideoSize(w, h)' \
          '            recorder.prepare()' \
          '            virtualDisplay = mediaProjection?.createVirtualDisplay("ScreenRec", w, h, metrics.densityDpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, recorder.surface, null, null)' \
          '            recorder.start()' \
          '            Log.d(TAG, "Recording started: " + outputFile?.absolutePath)' \
          '        } catch (e: Exception) {' \
          '            Log.e(TAG, "Error starting: " + e.message, e)' \
          '            stopSelf()' \
          '        }' \
          '    }' \
          '' \
          '    private fun stopRecording() {' \
          '        try { mediaRecorder?.stop() } catch (e: Exception) { Log.e(TAG, "Stop error: " + e.message, e) }' \
          '        try { mediaRecorder?.reset(); mediaRecorder?.release() } catch (_: Exception) {}' \
          '        mediaRecorder = null' \
          '        virtualDisplay?.release(); virtualDisplay = null' \
          '        mediaProjection?.stop(); mediaProjection = null' \
          '        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) stopForeground(STOP_FOREGROUND_REMOVE) else @Suppress("DEPRECATION") stopForeground(true)' \
          '        stopSelf()' \
          '    }' \
          '' \
          '    private fun createChannel() {' \
          '        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {' \
          '            val ch = NotificationChannel(CHANNEL_ID, "Screen Recording", NotificationManager.IMPORTANCE_LOW)' \
          '            getSystemService(NotificationManager::class.java).createNotificationChannel(ch)' \
          '        }' \
          '    }' \
          '' \
          '    private fun buildNotification(): Notification {' \
          '        val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) Notification.Builder(this, CHANNEL_ID) else @Suppress("DEPRECATION") Notification.Builder(this)' \
          '        return builder.setContentTitle("Screen Recorder").setContentText("Recording in progress").setSmallIcon(android.R.drawable.presence_video_online).setOngoing(true).build()' \
          '    }' \
          '}' > project/app/src/main/java/com/example/screenrecorder/RecorderService.kt

          echo "Kotlin sources created."

      - name: Generate Gradle wrapper
        working-directory: project
        shell: bash
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew[reference:6]
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Build Debug APK
        working-directory: project
        shell: bash
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
