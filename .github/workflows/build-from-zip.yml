name: Build Pro Flag Marble Race APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" || true
          fi

      - name: Create Gradle files
        run: |
          mkdir -p flagrace/app/src/main/java/com/flagrace/app
          mkdir -p flagrace/app/src/main/res/drawable
          cd flagrace

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "FlagRace"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.flagrace.app"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.flagrace.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 5
                  versionName = "5.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

      - name: Create manifest and resources
        run: |
          cd flagrace/app/src/main

          cat > AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Long Flag Race"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".RaceActivity"
                      android:screenOrientation="portrait"
                      android:keepScreenOn="true" />
              </application>
          </manifest>
          EOF

          cat > res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#4F9CDB" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFFFF" android:pathData="M54,54m-30,0a30,30 0,1 1,60 0a30,30 0,1 1,-60 0" />
              <path android:fillColor="#FFD700" android:pathData="M54,54m-15,0a15,15 0,1 1,30 0a15,15 0,1 1,-30 0" />
          </vector>
          EOF

      - name: Create Map Selection UI
        run: |
          cat > flagrace/app/src/main/java/com/flagrace/app/MainActivity.kt <<'EOF'
          package com.flagrace.app

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.GridLayout
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(Color.parseColor("#0F1A3A"))
                  root.gravity = Gravity.CENTER_HORIZONTAL
                  root.setPadding(40, 80, 40, 40)

                  val title = TextView(this)
                  title.text = "LONG RACE MAPS"
                  title.textSize = 34f
                  title.setTextColor(Color.WHITE)
                  title.gravity = Gravity.CENTER
                  title.setPadding(0, 0, 0, 20)
                  root.addView(title)

                  val sub = TextView(this)
                  sub.text = "Each race takes 1-2 minutes!"
                  sub.textSize = 18f
                  sub.setTextColor(Color.BLACK)
                  sub.setBackgroundColor(Color.parseColor("#B2E4D5"))
                  sub.gravity = Gravity.CENTER
                  sub.setPadding(20, 20, 20, 20)
                  root.addView(sub)

                  val grid = GridLayout(this)
                  grid.columnCount = 2
                  grid.setPadding(20, 20, 20, 20)
                  grid.setBackgroundColor(Color.parseColor("#B2E4D5"))
                  
                  val mapNames = listOf("Classic Zigzag", "Space Asteroids", "Food Funnels", "Spooky Walls")

                  for (i in mapNames.indices) {
                      val btn = Button(this)
                      btn.text = mapNames[i]
                      btn.textSize = 16f
                      btn.setTextColor(Color.WHITE)
                      val bg = GradientDrawable()
                      bg.setColor(Color.parseColor("#4F9CDB"))
                      bg.setStroke(4, Color.parseColor("#1A2238"))
                      bg.cornerRadius = 16f
                      btn.background = bg
                      
                      val lp = GridLayout.LayoutParams()
                      lp.width = 400
                      lp.height = 250
                      lp.setMargins(15, 15, 15, 15)
                      btn.layoutParams = lp

                      btn.setOnClickListener {
                          val intent = Intent(this, RaceActivity::class.java)
                          intent.putExtra("MAP_ID", i)
                          startActivity(intent)
                      }
                      grid.addView(btn)
                  }
                  root.addView(grid)

                  setContentView(root)
              }
          }
          EOF

      - name: Create Race Activity
        run: |
          cat > flagrace/app/src/main/java/com/flagrace/app/RaceActivity.kt <<'EOF'
          package com.flagrace.app

          import android.app.Activity
          import android.os.Bundle
          import android.view.WindowManager

          class RaceActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  val mapId = intent.getIntExtra("MAP_ID", 0)
                  val gameView = GameView(this, mapId)
                  setContentView(gameView)
              }
          }
          EOF

      - name: Create Complex Game Engine
        run: |
          cat > flagrace/app/src/main/java/com/flagrace/app/GameView.kt <<'EOF'
          package com.flagrace.app

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.view.SurfaceHolder
          import android.view.SurfaceView
          import kotlin.math.abs
          import kotlin.math.sqrt
          import kotlin.random.Random

          class GameView(context: Context, val mapId: Int) : SurfaceView(context), SurfaceHolder.Callback {

              private var gameThread: GameThread? = null
              @Volatile var isRunning = false

              // Long world settings
              val worldHeight = 18000f
              var cameraY = 0f
              
              val gravity = 0.4f
              val maxVy = 12f // Terminal velocity to prevent falling too fast
              val flagRadius = 40f
              
              var state = "RACING"
              var countdown = 0
              var finishLineY = worldHeight - 200f

              data class Racer(
                  val flag: String, val name: String,
                  var x: Float, var y: Float,
                  var vx: Float, var vy: Float,
                  var finishedRank: Int = -1
              )

              data class Obstacle(
                  var x: Float, var y: Float, 
                  var w: Float, var h: Float, 
                  val type: String, // CIRCLE, WALL
                  val color: Int, val emoji: String = "", 
                  var isMoving: Boolean = false, var moveDir: Float = 1f
              )

              val racers = mutableListOf<Racer>()
              val obstacles = mutableListOf<Obstacle>()
              val finishOrder = mutableListOf<Racer>()

              init {
                  holder.addCallback(this)
              }

              fun initGame() {
                  val w = width.toFloat()
                  if (w == 0f) return

                  racers.clear()
                  obstacles.clear()
                  finishOrder.clear()
                  cameraY = 0f
                  state = "RACING"
                  countdown = 0

                  val flagsData = listOf(
                      Pair("🇧🇩", "Bangladesh"), Pair("🇧🇷", "Brazil"),
                      Pair("🇺🇸", "USA"), Pair("🇻🇳", "Vietnam"),
                      Pair("🇮🇳", "India"), Pair("🇯🇵", "Japan"),
                      Pair("🇰🇷", "S.Korea"), Pair("🇬🇧", "UK"),
                      Pair("🇩🇪", "Germany"), Pair("🇮🇩", "Indonesia")
                  )

                  val spacing = w / (flagsData.size + 1)
                  for (i in flagsData.indices) {
                      racers.add(
                          Racer(
                              flag = flagsData[i].first, name = flagsData[i].second,
                              x = spacing * (i + 1), y = 80f,
                              vx = Random.nextFloat() * 4f - 2f, vy = 0f
                          )
                      )
                  }

                  generateMap(w)
              }

              private fun generateMap(w: Float) {
                  val emojis = when(mapId) {
                      1 -> listOf("☄️", "🪐", "👽")
                      2 -> listOf("🍩", "🍔", "🍕")
                      3 -> listOf("🎃", "👻", "🕷️")
                      else -> emptyList()
                  }

                  var currentY = 300f
                  val sectionHeight = 800f
                  var section = 0

                  while (currentY < finishLineY - 500f) {
                      when (section % 4) {
                          0 -> { // Peg Field
                              for (row in 0 until 4) {
                                  val cols = 5
                                  val startX = w / (cols + 1)
                                  for (c in 1..cols) {
                                      val emoji = if (emojis.isNotEmpty() && Random.nextBoolean()) emojis.random() else ""
                                      obstacles.add(Obstacle(
                                          x = startX * c, y = currentY + row * 150f,
                                          w = 35f, h = 35f, type = "CIRCLE",
                                          color = Color.parseColor("#1A2238"), emoji = emoji
                                      ))
                                  }
                              }
                          }
                          1 -> { // Zigzag Walls
                              val isLeft = Random.nextBoolean()
                              // Slanted wall
                              obstacles.add(Obstacle(0f, currentY, w * 0.7f, 40f, "WALL", Color.parseColor("#2E4A7D")))
                              obstacles.add(Obstacle(w * 0.3f, currentY + 300f, w * 0.7f, 40f, "WALL", Color.parseColor("#2E4A7D")))
                              
                              // Add some moving circles
                              for (i in 0..3) {
                                  obstacles.add(Obstacle(
                                      x = w / 5f * (i + 1), y = currentY + 150f, w = 30f, h = 30f, type = "CIRCLE",
                                      color = Color.parseColor("#E94560"), isMoving = true, moveDir = 1f
                                  ))
                              }
                          }
                          2 -> { // Funnels
                              obstacles.add(Obstacle(-50f, currentY + 100f, w * 0.6f, 40f, "WALL", Color.parseColor("#FFD700")))
                              obstacles.add(Obstacle(w * 0.4f, currentY + 100f, w * 0.6f, 40f, "WALL", Color.parseColor("#FFD700")))
                              
                              obstacles.add(Obstacle(-50f, currentY + 400f, w * 0.8f, 40f, "WALL", Color.parseColor("#FFD700")))
                              obstacles.add(Obstacle(w * 0.2f, currentY + 400f, w * 0.8f, 40f, "WALL", Color.parseColor("#FFD700")))
                          }
                          3 -> { // Random Obstacles
                              for (i in 0..6) {
                                  obstacles.add(Obstacle(
                                      x = Random.nextFloat() * (w - 100f) + 50f, 
                                      y = currentY + Random.nextFloat() * 400f,
                                      w = 45f, h = 45f, type = "CIRCLE",
                                      color = Color.parseColor("#6A2C70"), isMoving = Random.nextBoolean(), moveDir = 1f
                                  ))
                              }
                          }
                      }
                      currentY += sectionHeight
                      section++
                  }
              }

              fun updatePhysics() {
                  if (state == "FINISHED") {
                      countdown++
                      if (countdown > 60 * 12) initGame()
                      return
                  }

                  // Move obstacles
                  for (obs in obstacles) {
                      if (obs.isMoving) {
                          obs.x += obs.moveDir * 2.5f
                          if (obs.x > width - obs.w || obs.x < 0f) obs.moveDir *= -1f
                      }
                  }

                  for (racer in racers) {
                      if (racer.finishedRank != -1) continue

                      racer.vy += gravity
                      if (racer.vy > maxVy) racer.vy = maxVy

                      racer.x += racer.vx
                      racer.y += racer.vy

                      // Horizontal drag
                      racer.vx *= 0.98f

                      // Walls
                      if (racer.x < flagRadius) {
                          racer.x = flagRadius
                          racer.vx = abs(racer.vx) * 0.6f
                      } else if (racer.x > width - flagRadius) {
                          racer.x = width - flagRadius
                          racer.vx = -abs(racer.vx) * 0.6f
                      }

                      // Obstacle collisions
                      for (obs in obstacles) {
                          if (obs.type == "CIRCLE") {
                              val dx = racer.x - obs.x
                              val dy = racer.y - obs.y
                              val dist = sqrt(dx * dx + dy * dy)
                              val minDist = flagRadius + obs.w

                              if (dist < minDist && dist > 0) {
                                  val nx = dx / dist
                                  val ny = dy / dist
                                  
                                  racer.x = obs.x + nx * minDist
                                  racer.y = obs.y + ny * minDist

                                  val dot = racer.vx * nx + racer.vy * ny
                                  racer.vx = (racer.vx - 2 * dot * nx) * 0.7f + (Random.nextFloat() * 4f - 2f)
                                  racer.vy = (racer.vy - 2 * dot * ny) * 0.7f + Random.nextFloat() * 3f
                              }
                          } else if (obs.type == "WALL") {
                              // Simple AABB collision for slanted/straight walls
                              if (racer.x + flagRadius > obs.x && racer.x - flagRadius < obs.x + obs.w &&
                                  racer.y + flagRadius > obs.y && racer.y - flagRadius < obs.y + obs.h) {
                                  
                                  // Push up and bounce
                                  if (racer.vy > 0) {
                                      racer.y = obs.y - flagRadius
                                      racer.vy = -abs(racer.vy) * 0.6f
                                      // Random horizontal push to keep them moving
                                      racer.vx += (Random.nextFloat() * 6f - 3f)
                                  }
                              }
                          }
                      }

                      // Finish
                      if (racer.y >= finishLineY) {
                          racer.y = finishLineY
                          racer.finishedRank = finishOrder.size + 1
                          finishOrder.add(racer)
                          if (finishOrder.size == 1) {
                              state = "FINISHED"
                              countdown = 0
                          }
                      }
                  }

                  // Camera follow the leader
                  val activeRacers = racers.filter { it.finishedRank == -1 }
                  val targetCameraY = if (activeRacers.isNotEmpty()) {
                      activeRacers.maxOf { it.y } - height * 0.6f
                  } else {
                      finishLineY - height * 0.6f
                  }
                  
                  // Smooth camera movement
                  cameraY += (targetCameraY - cameraY) * 0.1f
                  if (cameraY < 0) cameraY = 0f
                  if (cameraY > finishLineY - height) cameraY = finishLineY - height
              }
              
              override fun surfaceCreated(holder: SurfaceHolder) {
                  isRunning = true
                  gameThread = GameThread(this, holder)
                  gameThread?.start()
              }

              override fun surfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {
                  initGame()
              }

              override fun surfaceDestroyed(holder: SurfaceHolder) {
                  isRunning = false
                  gameThread?.join()
              }
          }
          EOF

      - name: Create Game Thread (Rendering)
        run: |
          cat > flagrace/app/src/main/java/com/flagrace/app/GameThread.kt <<'EOF'
          package com.flagrace.app

          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.view.SurfaceHolder

          class GameThread(
              private val gameView: GameView,
              private val holder: SurfaceHolder
          ) : Thread() {

              private var isRunning = true
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  textAlign = Paint.Align.CENTER
                  typeface = android.graphics.Typeface.DEFAULT_BOLD
              }

              override fun run() {
                  var lastTime = System.nanoTime()
                  while (isRunning) {
                      val now = System.nanoTime()
                      val delta = (now - lastTime) / 1_000_000f
                      lastTime = now

                      if (delta < 16) {
                          try { sleep((16 - delta).toLong()) } catch (e: InterruptedException) {}
                      }

                      gameView.updatePhysics()

                      var canvas: Canvas? = null
                      try {
                          canvas = holder.lockCanvas()
                          if (canvas != null) {
                              synchronized(holder) { draw(canvas) }
                          }
                      } finally {
                          if (canvas != null) holder.unlockCanvasAndPost(canvas)
                      }
                  }
              }

              private fun draw(canvas: Canvas) {
                  val w = canvas.width.toFloat()
                  val h = canvas.height.toFloat()
                  val camY = gameView.cameraY

                  // Background
                  paint.color = Color.parseColor("#4F9CDB")
                  canvas.drawRect(0f, 0f, w, h, paint)

                  // Translate canvas for camera
                  canvas.save()
                  canvas.translate(0f, -camY)

                  // Draw Finish Line (if visible)
                  if (gameView.finishLineY in camY..(camY + h + 100)) {
                      paint.color = Color.WHITE
                      paint.strokeWidth = 15f
                      canvas.drawLine(0f, gameView.finishLineY, w, gameView.finishLineY, paint)
                      
                      paint.color = Color.BLACK
                      for (i in 0 until (w / 40).toInt()) {
                          if (i % 2 == 0) {
                              canvas.drawRect(i * 40f, gameView.finishLineY - 20f, (i + 1) * 40f, gameView.finishLineY, paint)
                          }
                      }
                  }

                  // Draw Obstacles (Culling for performance)
                  for (obs in gameView.obstacles) {
                      if (obs.y < camY - 100 || obs.y > camY + h + 100) continue

                      if (obs.type == "CIRCLE") {
                          if (obs.emoji.isEmpty()) {
                              paint.color = obs.color
                              canvas.drawCircle(obs.x, obs.y, obs.w, paint)
                          } else {
                              textPaint.textSize = obs.w * 2.2f
                              canvas.drawText(obs.emoji, obs.x, obs.y + (obs.w * 0.8f), textPaint)
                          }
                      } else if (obs.type == "WALL") {
                          paint.color = obs.color
                          canvas.drawRect(obs.x, obs.y, obs.x + obs.w, obs.y + obs.h, paint)
                          // Wall border for visibility
                          paint.color = Color.parseColor("#1A2238")
                          paint.style = Paint.Style.STROKE
                          paint.strokeWidth = 6f
                          canvas.drawRect(obs.x, obs.y, obs.x + obs.w, obs.y + obs.h, paint)
                          paint.style = Paint.Style.FILL
                      }
                  }

                  // Draw Racers
                  for (racer in gameView.racers) {
                      if (racer.finishedRank != -1 && gameView.state == "FINISHED") continue

                      paint.color = Color.WHITE
                      canvas.drawCircle(racer.x, racer.y, gameView.flagRadius, paint)

                      textPaint.textSize = 50f
                      canvas.drawText(racer.flag, racer.x, racer.y + 18f, textPaint)

                      textPaint.textSize = 24f
                      textPaint.color = Color.BLACK
                      canvas.drawText(racer.name, racer.x, racer.y - gameView.flagRadius - 5f, textPaint)
                  }

                  canvas.restore() // Restore camera translation

                  // --- UI OVERLAY (Static to screen) ---

                  // Leaderboard HUD
                  paint.color = Color.argb(180, 0, 0, 0)
                  canvas.drawRect(w - 330f, 40f, w - 20f, 400f, paint)
                  
                  textPaint.textAlign = Paint.Align.LEFT
                  textPaint.color = Color.WHITE
                  textPaint.textSize = 28f
                  canvas.drawText("🏆 POSITIONS", w - 310f, 80f, textPaint)

                  textPaint.textSize = 22f
                  var yPos = 120f

                  val active = gameView.racers.filter { it.finishedRank == -1 }.sortedByDescending { it.y }
                  val fin = gameView.finishOrder

                  for ((index, r) in fin.withIndex()) {
                      if (index < 4) {
                          textPaint.color = if (index == 0) Color.YELLOW else Color.WHITE
                          canvas.drawText("${index+1}. ${r.flag} ${r.name}", w - 310f, yPos, textPaint)
                          yPos += 40f
                      }
                  }
                  textPaint.color = Color.WHITE
                  for (r in active) {
                      if (yPos > 390f) break
                      val pos = fin.size + active.indexOf(r) + 1
                      canvas.drawText("$pos. ${r.flag} ${r.name}", w - 310f, yPos, textPaint)
                      yPos += 40f
                  }

                  // Mini-map / Progress bar on left
                  val barX = 30f
                  val barY = 100f
                  val barH = h - 200f
                  val barW = 20f
                  
                  paint.color = Color.argb(100, 0, 0, 0)
                  canvas.drawRect(barX, barY, barX + barW, barY + barH, paint)
                  
                  // Leader progress
                  val leader = active.maxByOrNull { it.y }
                  if (leader != null) {
                      val progress = (leader.y / gameView.finishLineY).coerceIn(0f, 1f)
                      paint.color = Color.YELLOW
                      canvas.drawRect(barX, barY, barX + barW, barY + (barH * progress), paint)
                  }

                  // Winner Overlay
                  if (gameView.state == "FINISHED" && gameView.finishOrder.isNotEmpty()) {
                      paint.color = Color.argb(220, 0, 0, 0)
                      canvas.drawRect(0f, h / 2 - 250f, w, h / 2 + 250f, paint)

                      textPaint.textAlign = Paint.Align.CENTER
                      val winner = gameView.finishOrder[0]
                      textPaint.color = Color.YELLOW
                      textPaint.textSize = 50f
                      canvas.drawText("🏆 CHAMPION 🏆", w / 2, h / 2 - 120f, textPaint)

                      textPaint.textSize = 120f
                      canvas.drawText(winner.flag, w / 2, h / 2 + 20f, textPaint)

                      textPaint.color = Color.WHITE
                      textPaint.textSize = 45f
                      canvas.drawText(winner.name, w / 2, h / 2 + 120f, textPaint)
                      
                      textPaint.color = Color.LTGRAY
                      textPaint.textSize = 25f
                      canvas.drawText("Restarting race...", w / 2, h / 2 + 180f, textPaint)
                  }
              }
          }
          EOF

      - name: Show generated project
        run: find flagrace -type f | sort

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: flagrace
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pro-Flag-Race-APK
          path: flagrace/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
